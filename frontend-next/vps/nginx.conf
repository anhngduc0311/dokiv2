proxy_cache_path /var/cache/nginx/dokitruyen levels=1:2 keys_zone=dokitruyen:8m max_size=512m min_free=1g inactive=24h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=dokitruyen_rate:1m rate=50r/s;
server {
    listen 80;
    server_name source.dokitruyen.com;
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    location / {
        limit_req zone=dokitruyen_rate burst=100 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host localhost;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache dokitruyen;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 25s;
        proxy_cache_lock_age 25s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
        add_header X-Relay vps always;
        add_header X-Relay-Cache $upstream_cache_status always;
    }
}
